'Already owned': '所持済み'
'Already owned by: {users}. Remove these recipients before granting.': '以下のユーザーはすでに所持しています：{users}。対象から除外してから付与してください。'
'An avatar frame with this name already exists.': 'この名前のアバターフレームはすでに存在します。別の名前を使用してください。'
'Apply this action to {count} selected users?': '選択した {count} 人のユーザーにこの操作を適用しますか？'
'Avatar frame management': 'アバターフレーム管理'
'Choose a PNG or WebP file no larger than 2 MiB.': '2 MiB 以下の PNG または WebP ファイルを選択してください。'
'Choose frame (coming soon)': 'フレームを選択（準備中）'
'Choose one artwork per shape.': '形状ごとに1つの画像素材を選択してください。'
'Circular': '円形'
'Circular artwork': '円形素材'
'Circular artwork overlaps the avatar area. Check the preview.': '円形素材の装飾がアバター領域に入り込んでいます。プレビューを確認してください。'
'Delete {name}? It will be removed from all users and cannot be restored.': '「{name}」を削除しますか？すべてのユーザーから削除され、元に戻すことはできません。'
'Delete frame': 'フレームを削除'
'Describe the honor and how this frame is awarded.': 'このフレームが表す栄誉や授与の条件について説明してください。'
'Drop artwork here or click to choose': 'ここに画像をドロップするか、クリックして選択'
'Drop artwork here to replace, or click to choose': 'ここに画像をドロップして置換するか、クリックして選択'
'Edit description': '説明を編集'
'Edit frame': 'フレームを編集'
'Equip frame': '装着'
'Equipped': '装着中'
'Equipping replaces the current frame. Unequipping keeps ownership; revoking removes it.': '装着すると現在のフレームが置き換えられます。装着解除しても所持権は保持されますが、取り消すと所持資格が削除されます。'
'Frame artwork': 'フレーム画像'
'Frame artwork must be 512 × 512 px.': 'フレーム画像は 512 × 512 px である必要があります。'
'Frame artwork must be square, between 64 and 1024 pixels.': 'フレーム画像は 64〜1024 ピクセルの正方形である必要があります。'
'Frame description': 'フレームの説明'
'Frame must contain transparent and visible pixels': '画像には透明な部分と可視ピクセルの両方が含まれている必要があります。'
'Frame name': 'フレーム名'
'Frame owners': 'フレーム所持者'
'Frames are global. Upload as a draft, then publish before awarding to a user.': 'フレームは全ドメイン共通です。下書きとしてアップロードし、公開してからユーザーに授与してください。'
'Global appearance': '共通の外観'
'Grant frame': 'フレームを授与'
'Grant this frame to {user}?': 'このフレームを {user} に授与しますか？'
'Honor avatar frame': '栄誉アバターフレーム'
'Honor frames are supplied by system administrators. Equipping will be available after server integration.': '栄誉フレームはシステム管理者が提供します。装着機能はサーバー連携後に利用できます。'
'Honor frames belong to your global account and remain the same in every domain.': '栄誉フレームはアカウント共通で、すべてのドメインで同じものが表示されます。'
'Invalid PNG artwork. Please export a new PNG or WebP image.': 'PNG 画像のデータが無効です。新しい PNG または WebP 画像を書き出してください。'
'Manage honor frames': '栄誉アバターフレーム管理'
'No available honor frames. Frames are awarded by system administrators.': '利用可能な栄誉フレームはありません。フレームはシステム管理者によって授与されます。'
'No description yet.': '説明はまだありません。'
'No honor frame equipped': '栄誉フレームは未装着です'
'No honor frames found.': '条件に一致する栄誉フレームが見つかりません。'
'One name, two shapes. Canvas: 512 × 512 px; avatar: 384 px; decoration margin: 64 px. Leave the center transparent, not white.': '1つの名前に2つの形状。キャンバス：512 × 512 px、アバター：384 px、周囲の装飾マージン：各 64 px。中央は白ではなく透明にしてください。'
'Only published frames can be awarded. Awards are global across all domains.': '公開されたフレームのみ授与できます。付与された資格は全ドメイン共通です。'
'Owned honor frames': '所持している栄誉フレーム'
'Owners': '所持者'
'Preview frame artwork': 'フレーム素材のプレビュー'
'Publish': '公開'
'Publish frame (coming soon)': 'フレームを公開（準備中）'
'Publish this frame so it can be awarded?': 'このフレームを公開して授与できるようにしますか？'
'Publishing and awarding frames will be enabled after server integration.': '公開と授与はサーバー連携後に利用できます。'
'Recipients': '付与対象ユーザー'
'Replacing legacy artwork requires both shapes.': '旧形式のフレーム画像を置き換える際は、角丸正方形と円形の両方をアップロードしてください。'
'Revoke frame': 'フレームを取り消す'
'Revoke this frame from {user}? It will also be unequipped.': '{user} からこのフレームを取り消しますか？装着も解除されます。'
'Rounded square': '角丸正方形'
'Rounded square artwork': '角丸正方形素材'
'Rounded square artwork overlaps the avatar area. Check the preview.': '角丸正方形素材の装飾がアバター領域に入り込んでいます。プレビューを確認してください。'
'Saved, but old artwork cleanup failed.': '保存されましたが、古い画像素材のクリーンアップに失敗しました。'
'Saved. Please refresh this page.': '保存しました。このページを再読み込みしてください。'
'Search by username or user ID': 'ユーザー名またはユーザー ID で検索'
'Search by username or user ID. Up to 50 users at a time.': 'ユーザー名またはユーザー ID で検索できます。一度に最大 50 人まで選択可能です。'
'Search frames': 'フレームを検索'
'Select a frame and at least one user.': 'フレームと少なくとも1人のユーザーを選択してください。'
'Select a user by ID to grant or revoke frames.': 'ユーザー ID で検索し、フレームの授与または取り消しを行います。'
'Select current page': 'このページのユーザーを選択'
'Some selected users already own this avatar frame.': '選択したユーザーの中に、すでにこのフレームを所持しているユーザーがいます。'
'Some users changed during this operation. Refresh and retry.': '操作中に一部のユーザーの所持情報が変更されました。更新してやり直してください。'
'These avatar frame images have already been uploaded.': 'このフレーム画像はすでにアップロードされています。既存のフレームを使用してください。'
'This frame changed. Refresh and try again.': 'このフレームは変更されました。更新してもう一度お試しください。'
'Transparent center: 384 × 384 px, corner radius 64 px, starting at (64, 64).': '中央透明領域：384 × 384 px、角丸半径 64 px、左上座標 (64, 64)。'
'Transparent center: diameter 384 px, centered at (256, 256).': '中央透明領域：直径 384 px、中心座標 (256, 256)。'
'Unable to process frame artwork.': 'フレーム画像を処理できません。画像が有効か確認してください。'
'Unchanged artwork is kept. Editing preserves ownership and publication status.': '変更されていない素材は保持されます。編集しても所持権や公開状態は維持されます。'
'Unequip frame': '装着解除'
'Unpublish': '非公開にする'
'Unpublish this frame? It will stop displaying for all users.': 'このフレームを非公開にしますか？すべてのユーザーに表示されなくなります。'
'Upload artwork, publish frames, and manage user awards across all domains.': '画像素材のアップロード、フレームの公開、および全ドメインにおけるユーザーへの授与を管理します。'
'Upload both rounded square and circular artwork.': '角丸正方形と円形の両方の素材をアップロードしてください。'
'Upload frame': 'フレームをアップロード'
'Uploaded frames start disabled. Publish them from the library.': 'アップロードされたフレームは無効な状態から始まります。ライブラリから公開してください。'
