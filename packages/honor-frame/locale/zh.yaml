'Already owned': '已拥有'
'Already owned by: {users}. Remove these recipients before granting.': '以下用户已拥有此头像框：{users}。请移除这些用户后再授予。'
'An avatar frame with this name already exists.': '已存在同名头像框，请使用其他名称。'
'Apply this action to {count} selected users?': '确定对选中的 {count} 位用户执行此操作吗？'
'Avatar frame management': '头像框管理'
Choose a PNG or WebP file no larger than 2 MiB.: 请选择不超过 2 MiB 的 PNG 或 WebP 文件。
Choose frame (coming soon): 选择头像框（暂未开放）
'Choose one artwork per shape.': '每种形状请选择一份素材。'
'Circular': '圆形'
'Circular artwork': '圆形素材'
'Circular artwork overlaps the avatar area. Check the preview.': '圆形素材的装饰进入了头像区域，请检查预览效果。'
'Delete {name}? It will be removed from all users and cannot be restored.': '确定删除「{name}」吗？所有用户将失去此头像框，此操作无法恢复。'
'Delete frame': '删除头像框'
'Describe the honor and how this frame is awarded.': '介绍此头像框代表的荣誉及获得条件。'
'Drop artwork here or click to choose': '拖拽素材到此处，或点击选择'
'Drop artwork here to replace, or click to choose': '拖拽素材到此处替换，或点击选择'
'Edit description': '编辑描述'
'Edit frame': '编辑头像框'
Equip frame: 佩戴
Equipped: 已佩戴
'Equipping replaces the current frame. Unequipping keeps ownership; revoking removes it.': '启用会替换当前佩戴的头像框。停用仅取消佩戴，收回会移除拥有资格。'
Frame artwork: 头像框素材
'Frame artwork must be 512 × 512 px.': '头像框素材必须为 512 × 512px。'
Frame artwork must be square, between 64 and 1024 pixels.: 头像框必须为 64 至 1024 像素的正方形图片。
'Frame description': '头像框描述'
'Frame must contain transparent and visible pixels': '素材必须同时包含透明区域和可见装饰，不能完全不透明或全透明。'
Frame name: 头像框名称
'Frame owners': '拥有该头像框的用户'
Frames are global. Upload as a draft, then publish before awarding to a user.: 头像框全站通用。上传后为未发布状态，发布后即可授予用户。
Global appearance: 全局外观
Grant frame: 授予头像框
Grant this frame to {user}?: 确定将此头像框授予 {user} 吗？
Honor avatar frame: 荣誉头像框
Honor frames are supplied by system administrators. Equipping will be available after server integration.: 荣誉头像框由系统管理员提供，佩戴功能将在接入服务端后开放。
Honor frames belong to your global account and remain the same in every domain.: 荣誉头像框属于全局账户，在所有域中保持一致。
'Invalid PNG artwork. Please export a new PNG or WebP image.': '图片格式或数据无效，请重新导出 PNG 或 WebP 素材。'
Manage honor frames: 荣誉头像框管理
No available honor frames. Frames are awarded by system administrators.: 暂无可用的荣誉头像框。头像框由系统管理员授予。
'No description yet.': '暂无描述。'
No honor frame equipped: 暂未佩戴荣誉头像框
No honor frames found.: 暂无符合条件的头像框。
'One name, two shapes. Canvas: 512 × 512 px; avatar: 384 px; decoration margin: 64 px. Leave the center transparent, not white.': '一个名称对应两种形状。画布 512 × 512px，中心头像 384px，四周装饰区各 64px。中心须透明，不要填充白色。'
'Only published frames can be awarded. Awards are global across all domains.': '只能授予已发布的头像框，拥有资格在所有域中通用。'
'Owned honor frames': '拥有的头像框'
'Owners': '拥有者'
Preview frame artwork: 预览头像框素材
Publish: 发布
Publish frame (coming soon): 发布头像框（暂未开放）
Publish this frame so it can be awarded?: 确定发布此头像框，以便授予用户吗？
Publishing and awarding frames will be enabled after server integration.: 发布和颁发功能将在接入服务端后开放。
'Recipients': '授予用户'
'Replacing legacy artwork requires both shapes.': '替换旧格式头像框素材时，请同时上传圆角方形和圆形两份素材。'
Revoke frame: 撤销头像框
Revoke this frame from {user}? It will also be unequipped.: 确定撤销 {user} 的此头像框吗？当前佩戴也会被取消。
'Rounded square': '圆角方形'
'Rounded square artwork': '圆角方形素材'
'Rounded square artwork overlaps the avatar area. Check the preview.': '圆角方形素材的装饰进入了头像区域，请检查预览效果。'
'Saved, but old artwork cleanup failed.': '已保存，但旧素材清理失败。'
'Saved. Please refresh this page.': '已保存，请刷新此页面。'
'Search by username or user ID': '通过用户名或用户 ID 搜索'
'Search by username or user ID. Up to 50 users at a time.': '可通过用户名或用户 ID 搜索，每次最多选择 50 位用户。'
Search frames: 搜索头像框
'Select a frame and at least one user.': '请选择一个头像框和至少一位用户。'
Select a user by ID to grant or revoke frames.: 输入并查询用户 ID 后，可以为该用户授予或撤销头像框。
'Select current page': '选择本页用户'
'Some selected users already own this avatar frame.': '部分已选用户已拥有此头像框，请检查名单后再授予。'
'Some users changed during this operation. Refresh and retry.': '部分用户的拥有资格已变更，请刷新后重试。'
'These avatar frame images have already been uploaded.': '此头像框的素材已上传，请直接使用已有头像框。'
'This frame changed. Refresh and try again.': '此头像框已发生变化，请刷新后重试。'
'Transparent center: 384 × 384 px, corner radius 64 px, starting at (64, 64).': '中心透明区域：384 × 384px，圆角半径 64px，左上角坐标 (64, 64)。'
'Transparent center: diameter 384 px, centered at (256, 256).': '中心透明区域：直径 384px，圆心坐标 (256, 256)。'
Unable to process frame artwork.: 无法处理头像框图片，请检查图片是否有效。
'Unchanged artwork is kept. Editing preserves ownership and publication status.': '未替换的素材将保留。编辑不会改变拥有资格及发布状态。'
Unequip frame: 取消佩戴
Unpublish: 停用
Unpublish this frame? It will stop displaying for all users.: 确定停用此头像框吗？所有用户都将停止展示它。
Upload artwork, publish frames, and manage user awards across all domains.: 上传与发布头像框，并统一管理所有域中用户的获颁资格。
'Upload both rounded square and circular artwork.': '请同时上传圆角方形和圆形两份素材。'
Upload frame: 上传头像框
'Uploaded frames start disabled. Publish them from the library.': '上传后默认为已停用，可在头像框管理页面发布。'
