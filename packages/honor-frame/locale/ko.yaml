'Already owned': '이미 보유 중'
'Already owned by: {users}. Remove these recipients before granting.': '다음 사용자가 이미 이 프레임을 보유하고 있습니다: {users}. 해당 사용자를 제외한 후 수여하세요.'
'An avatar frame with this name already exists.': '이미 같은 이름의 아바타 프레임이 있습니다. 다른 이름을 사용하세요.'
'Apply this action to {count} selected users?': '선택한 {count}명의 사용자에게 이 작업을 적용할까요?'
'Avatar frame management': '아바타 프레임 관리'
'Choose a PNG or WebP file no larger than 2 MiB.': '2 MiB 이하의 PNG 또는 WebP 파일을 선택해 주세요.'
'Choose frame (coming soon)': '프레임 선택 (준비 중)'
'Choose one artwork per shape.': '모양별로 하나의 이미지를 선택하세요.'
'Circular': '원형'
'Circular artwork': '원형 이미지'
'Circular artwork overlaps the avatar area. Check the preview.': '원형 이미지의 장식이 아바타 영역과 겹칩니다. 미리 보기를 확인하세요.'
'Delete {name}? It will be removed from all users and cannot be restored.': '''{name}'' 프레임을 삭제할까요? 모든 사용자의 보유 항목에서 제거되며 복구할 수 없습니다.'
'Delete frame': '프레임 삭제'
'Describe the honor and how this frame is awarded.': '이 프레임이 나타내는 명예와 획득 조건을 설명하세요.'
'Drop artwork here or click to choose': '이미지를 여기에 끌어다 놓거나 클릭하여 선택'
'Drop artwork here to replace, or click to choose': '이미지를 여기에 끌어다 놓아 변경하거나 클릭하여 선택'
'Edit description': '설명 편집'
'Edit frame': '프레임 편집'
'Equip frame': '착용'
'Equipped': '착용 중'
'Equipping replaces the current frame. Unequipping keeps ownership; revoking removes it.': '착용 시 현재 프레임이 교체됩니다. 착용 해제 시 소유권은 유지되며, 회수 시 소유 자격이 제거됩니다.'
'Frame artwork': '프레임 이미지'
'Frame artwork must be 512 × 512 px.': '프레임 이미지는 512 × 512 px여야 합니다.'
'Frame artwork must be square, between 64 and 1024 pixels.': '프레임 이미지는 64~1024픽셀 사이의 정사각형이어야 합니다.'
'Frame description': '프레임 설명'
'Frame must contain transparent and visible pixels': '이미지에는 투명 영역과 표시되는 장식 픽셀이 모두 포함되어야 합니다.'
'Frame name': '프레임 이름'
'Frame owners': '프레임 보유자'
'Frames are global. Upload as a draft, then publish before awarding to a user.': '프레임은 전체 도메인 공통입니다. 초안으로 업로드한 후 게시해야 사용자에게 수여할 수 있습니다.'
'Global appearance': '공통 외관'
'Grant frame': '프레임 수여'
'Grant this frame to {user}?': '이 프레임을 {user}에게 수여할까요?'
'Honor avatar frame': '명예 아바타 프레임'
'Honor frames are supplied by system administrators. Equipping will be available after server integration.': '명예 프레임은 시스템 관리자가 제공합니다. 착용 기능은 서버 연동 후 사용할 수 있습니다.'
'Honor frames belong to your global account and remain the same in every domain.': '명예 프레임은 계정에 속하며 모든 도메인에서 동일하게 표시됩니다.'
'Invalid PNG artwork. Please export a new PNG or WebP image.': '유효하지 않은 PNG 이미지입니다. 새로운 PNG 또는 WebP 이미지를 다시 내보내세요.'
'Manage honor frames': '명예 아바타 프레임 관리'
'No available honor frames. Frames are awarded by system administrators.': '사용 가능한 명예 프레임이 없습니다. 프레임은 시스템 관리자가 수여합니다.'
'No description yet.': '설명이 아직 없습니다.'
'No honor frame equipped': '착용한 명예 프레임이 없습니다'
'No honor frames found.': '해당하는 명예 프레임이 없습니다.'
'One name, two shapes. Canvas: 512 × 512 px; avatar: 384 px; decoration margin: 64 px. Leave the center transparent, not white.': '하나의 이름에 두 가지 모양. 캔버스: 512 × 512 px, 아바타: 384 px, 주변 장식 여백: 각 64 px. 가운데 영역은 흰색이 아닌 투명이어야 합니다.'
'Only published frames can be awarded. Awards are global across all domains.': '게시된 프레임만 수여할 수 있습니다. 획득한 자격은 모든 도메인에서 공통으로 적용됩니다.'
'Owned honor frames': '보유한 명예 프레임'
'Owners': '소유자'
'Preview frame artwork': '프레임 이미지 미리 보기'
'Publish': '게시'
'Publish frame (coming soon)': '프레임 게시 (준비 중)'
'Publish this frame so it can be awarded?': '이 프레임을 게시하여 수여할 수 있도록 할까요?'
'Publishing and awarding frames will be enabled after server integration.': '게시 및 수여 기능은 서버 연동 후 사용할 수 있습니다.'
'Recipients': '수여 대상자'
'Replacing legacy artwork requires both shapes.': '기존 규격 이미지를 교체할 때는 둥근 모서리 사각형과 원형 이미지를 모두 업로드해야 합니다.'
'Revoke frame': '프레임 회수'
'Revoke this frame from {user}? It will also be unequipped.': '{user}에게서 이 프레임을 회수할까요? 착용도 해제됩니다.'
'Rounded square': '둥근 사각형'
'Rounded square artwork': '둥근 사각형 이미지'
'Rounded square artwork overlaps the avatar area. Check the preview.': '둥근 사각형 이미지의 장식이 아바타 영역과 겹칩니다. 미리 보기를 확인하세요.'
'Saved, but old artwork cleanup failed.': '저장되었으나 이전 이미지 정리에 실패했습니다.'
'Saved. Please refresh this page.': '저장되었습니다. 이 페이지를 새로고침하세요.'
'Search by username or user ID': '사용자 이름 또는 사용자 ID로 검색'
'Search by username or user ID. Up to 50 users at a time.': '사용자 이름 또는 ID로 검색할 수 있으며, 한 번에 최대 50명까지 선택 가능합니다.'
'Search frames': '프레임 검색'
'Select a frame and at least one user.': '프레임과 최소 한 명의 사용자를 선택하세요.'
'Select a user by ID to grant or revoke frames.': '사용자 ID를 입력하여 해당 사용자에게 프레임을 수여하거나 회수하세요.'
'Select current page': '현재 페이지 사용자 선택'
'Some selected users already own this avatar frame.': '선택한 사용자 중 일부가 이미 이 아바타 프레임을 보유하고 있습니다.'
'Some users changed during this operation. Refresh and retry.': '작업 중 일부 사용자의 보유 상태가 변경되었습니다. 새로고침 후 다시 시도하세요.'
'These avatar frame images have already been uploaded.': '이 아바타 프레임 이미지는 이미 업로드되었습니다. 기존 프레임을 사용하세요.'
'This frame changed. Refresh and try again.': '이 프레임 정보가 변경되었습니다. 새로고침 후 다시 시도하세요.'
'Transparent center: 384 × 384 px, corner radius 64 px, starting at (64, 64).': '중앙 투명 영역: 384 × 384 px, 모서리 반경 64 px, 시작 좌표 (64, 64).'
'Transparent center: diameter 384 px, centered at (256, 256).': '중앙 투명 영역: 지름 384 px, 중심 좌표 (256, 256).'
'Unable to process frame artwork.': '프레임 이미지를 처리할 수 없습니다. 유효한 이미지인지 확인하세요.'
'Unchanged artwork is kept. Editing preserves ownership and publication status.': '변경되지 않은 이미지는 유지됩니다. 편집해도 소유권과 게시 상태는 유지됩니다.'
'Unequip frame': '착용 해제'
'Unpublish': '게시 취소'
'Unpublish this frame? It will stop displaying for all users.': '이 프레임을 게시 취소할까요? 모든 사용자의 화면에서 표시가 중단됩니다.'
'Upload artwork, publish frames, and manage user awards across all domains.': '이미지를 업로드하고 프레임을 게시하며, 모든 도메인의 사용자 수여 자격을 관리합니다.'
'Upload both rounded square and circular artwork.': '둥근 사각형과 원형 이미지를 모두 업로드하세요.'
'Upload frame': '프레임 업로드'
'Uploaded frames start disabled. Publish them from the library.': '업로드된 프레임은 비활성화 상태로 시작됩니다. 라이브러리에서 게시하세요.'
