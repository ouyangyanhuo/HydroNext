# クライアント更新管理
'All version values may be lowered when publishing. Use a new, higher buildVersion to distribute rollback code to newer clients. Proctor version requirements are unchanged.': '公開時、すべてのバージョン値を下げることができます。新しいクライアントにロールバックコードを配布するには、より大きな新しい buildVersion を使用してください。監視指定バージョンは変更されません。'
'Authorization may require reselecting the file. Uploaded files are private until published; published package URLs remain available.': '再認証後にファイルを再選択する必要がある場合があります。アップロードされたファイルは公開されるまで非公開です。公開済みパッケージの URL は引き続き有効です。'
'Increment the version before replacing the ASAR package.': 'ASAR パッケージを置き換える前に、リリースバージョン番号を上げてください。'
'Informational in the current client.': '現在のクライアントではメタデータとしてのみ使用されます。'
'Minimum version cannot exceed the release version.': '最小バージョンはリリースバージョンを超えることはできません。'
'Publishing does not change the required version in proctor settings. ASAR replacements require a higher version.': '公開しても監視設定の必須バージョンは変更されません。ASAR を置き換える場合はバージョンを上げる必要があります。'
'Release version cannot go backwards.': 'リリースバージョンを現在公開されているバージョンより低くすることはできません。'
'The client must support buildVersion comparison before using this manifest for update ordering. Publishing lower values is allowed; clients do not automatically downgrade.': 'このマニフェストで更新順序を決定する前に、クライアントが buildVersion の比較に対応している必要があります。より低い値の公開も許可されますが、クライアントは自動的にダウングレードしません。'
'The current client does not enforce minimum versions or verify SHA-256. Installer links are for manual downloads; fallback and signature support require client changes.': '現在のクライアントは最小バージョンの強制や SHA-256 の検証を行いません。インストーラーのリンクは手動ダウンロード用です。フォールバックや署名サポートにはクライアントの修正が必要です。'

