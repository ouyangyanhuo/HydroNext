# クライアント更新管理
'25 packages per page': '1ページあたり25パッケージ'
'ASAR fallback URL': 'ASAR 代替 URL'
'ASAR must contain a root package.json and a valid entry point.': 'ASAR にはルートの package.json と有効なエントリポイントを含める必要があります。クライアントのパッケージ範囲を修正してください。'
'ASAR size in bytes': 'ASAR ファイルサイズ（バイト）'
